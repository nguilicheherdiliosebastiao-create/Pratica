<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            margin-top: 0px;
            padding: 0px;
        }
        main{
            margin: auto;
            margin-top: 0px;
            display:flex;
            align-items: center;
            flex-direction: row;
            border: 2px solid none;
            justify-content: center;
            height: 500px;
            align-items: flex-start;
            background-color: #8C5C32;
            margin:050px auto;
            width: 1100px;
        }
        div{
            text-align: center;
            align-items: center;
            height: 200px;
            width: 200px;
            background-color: #F2E9D8;
           
            
            
            padding-top: 20px;
            padding-left: 20px;
            
            margin: 20px  ;
            
            border: 2px solid #ccbab6;
            
            
        }
        div:hover{
            background-color: rgb(102, 102, 168);
            box-shadow: 2px 2px 20px #D97B66;
            outline: 2px solid black;
        }
        div:active{
            background-color: brown;
        }
    </style>
</head>
<body>
    <main>
        <div id="d1">Herdilio</div>
        <div id="d2">Sebastiao</div>
        <div id="d3">Nguiliche</div>
    </main>
</body>
</html>
